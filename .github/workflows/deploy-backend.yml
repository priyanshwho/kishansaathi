name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'krishisarthi-api/**'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'krishisarthi-api/**'
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # Block 1: Automated Testing & API Route Verification
  # ─────────────────────────────────────────────────────────────
  test-api:
    name: 🧪 Test Routes & API Endpoints
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: krishisarthi-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Pytest Route Verification Suite
        working-directory: krishisarthi-api
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || 'dummy-client-id.apps.googleusercontent.com' }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || 'dummy-client-secret' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/dummy' }}
        run: |
          PYTHONPATH=. pytest tests -v

  # ─────────────────────────────────────────────────────────────
  # Block 2: Automatic Deployment to Oracle Cloud (Runs only if tests pass)
  # ─────────────────────────────────────────────────────────────
  deploy-oracle:
    name: 🚀 Deploy to Oracle Cloud VM
    needs: [test-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            export PATH="$HOME/.local/bin:$HOME/bin:$PATH"

            echo "🚀 1/4 Pulling latest changes from GitHub..."
            cd /home/priyanshu/Krishi-Sarthii
            git pull origin main

            echo "📦 2/4 Updating dependencies via uv..."
            cd /home/priyanshu/Krishi-Sarthii/krishisarthi-api
            uv pip install -r requirements.txt --python .venv/bin/python

            echo "🔄 3/4 Restarting KishanSaathi backend service..."
            systemctl --user daemon-reload
            systemctl --user restart krishisarthi
            systemctl --user status krishisarthi --no-pager

            echo "🔍 4/4 Performing live smoke healthcheck..."
            sleep 2
            curl -s -f https://kapi.priyanshu.cv/docs > /dev/null
            echo "✅ Deployment completed and live endpoint verified successfully!"
